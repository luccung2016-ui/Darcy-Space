<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darcy's Space V5.6</title><style>html,body,#dash{margin:0;width:100%;height:100%;border:0;background:#f6f7f9}body{overflow:hidden}#dash{display:block}</style></head><body><iframe id="dash" src="v5.5.html" title="Darcy's Space"></iframe><script>
const f=document.getElementById('dash');f.addEventListener('load',()=>{const d=f.contentDocument,w=f.contentWindow;const s=d.createElement('style');s.textContent=`
.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mini-kpi{padding:16px;border:1px solid #e5e7eb;border-radius:14px;background:#fff}.mini-kpi b{font-size:24px;display:block}.myday{display:grid;grid-template-columns:1fr 1fr;gap:14px}.day-card{border:1px solid #e5e7eb;border-radius:15px;background:#fff;padding:16px}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.day-item{padding:10px 0;border-top:1px solid #f0f1f3}.day-item:first-of-type{border-top:0}.danger{color:#b42318;font-weight:700}.good{color:#198754;font-weight:700}.toolbar2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar2 select,.toolbar2 input{width:auto}.lib-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.lib-card{min-height:180px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;padding:16px;display:flex;flex-direction:column}.lib-card .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.lib-actions{margin-top:auto;display:flex;justify-content:space-between;align-items:center}.type-badge{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#707784}.dots{border:0;background:transparent;font-size:20px;cursor:pointer}.perf-layout{display:grid;grid-template-columns:2fr 1fr;gap:14px}.chartbox{height:230px;border:1px solid #e5e7eb;border-radius:14px;padding:16px;background:linear-gradient(#fff,#fafafa);position:relative}.bars{height:160px;display:flex;align-items:flex-end;gap:10px;padding-top:20px}.bar{flex:1;background:#d12026;border-radius:7px 7px 2px 2px;min-height:3px;opacity:.8}.barlabel{text-align:center;font-size:9px;color:#707784;margin-top:5px}.cal-switch .on{background:#20242b;color:#fff}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week-col{min-height:300px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:9px}.week-date{font-weight:800;margin-bottom:8px}.deadline-event{border-left:3px solid #d12026;background:#fff0f1;padding:7px;border-radius:7px;margin:5px 0;font-size:10px}.schedule-event{border-left:3px solid #7c3aed;background:#f5f3ff;padding:7px;border-radius:7px;margin:5px 0;font-size:10px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}@media(max-width:1000px){.lib-grid{grid-template-columns:repeat(2,1fr)}.report-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.myday,.perf-layout,.summary-grid,.lib-grid{grid-template-columns:1fr}.week-grid{display:block}.week-col{min-height:auto;margin:8px 0}}
`;d.head.appendChild(s);
const $=q=>d.querySelector(q),$$=q=>[...d.querySelectorAll(q)],E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let x=new Date(),m=String(x.getMonth()+1).padStart(2,'0'),z=String(x.getDate()).padStart(2,'0');return x.getFullYear()+'-'+m+'-'+z};const done=x=>/hoàn thành|đã chốt|đã đăng/i.test(x||'');const dd=x=>x?x.slice(8,10)+'/'+x.slice(5,7):'—';const days=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000);function deadlineText(x){if(!x)return 'Chưa có deadline';let n=days(today(),x);return n<0?'Trễ '+Math.abs(n)+' ngày':n===0?'Hạn hôm nay':'Còn '+n+' ngày'}
// Contextual header actions
function contextHeader(page){const a=$('.top .actions');if(!a)return;if(page==='performance')a.innerHTML='<button class="btn" id="ctxRefresh">↻ Refresh</button><button class="btn primary" id="ctxMetric">＋ Update Data</button><button class="btn" id="ctxLogout">Đăng xuất</button>';else if(page==='library')a.innerHTML='<button class="btn" id="ctxRefresh">↻ Refresh</button><button class="btn primary" id="ctxResource">＋ Resource</button><button class="btn" id="ctxLogout">Đăng xuất</button>';else if(page==='calendar')a.innerHTML='<button class="btn primary" id="ctxTask">＋ Task</button><button class="btn soft" id="ctxSchedule">＋ Schedule</button><button class="btn" id="ctxRefresh">↻</button><button class="btn" id="ctxLogout">Đăng xuất</button>';else a.innerHTML='<button class="btn primary" id="ctxTask">＋ Task</button><button class="btn soft" id="ctxProject">＋ Project</button><button class="btn" id="ctxRefresh">↻</button><button class="btn" id="ctxLogout">Đăng xuất</button>';$('#ctxTask')?.addEventListener('click',()=>$('#quickTask')?.click());$('#ctxProject')?.addEventListener('click',()=>$('#quickProject')?.click());$('#ctxMetric')?.addEventListener('click',()=>$('#addMetric')?.click());$('#ctxResource')?.addEventListener('click',()=>$('#addResource')?.click());$('#ctxSchedule')?.addEventListener('click',()=>$('#addSchedule')?.click());$('#ctxRefresh')?.addEventListener('click',()=>$('#syncBtn')?.click());$('#ctxLogout')?.addEventListener('click',()=>$('#logoutBtn')?.click())}
// Overview
function renderOverview(){const sec=$('#overview');if(!sec||!w.D)return;let T=w.D.tasks||[],P=w.D.projects||[],now=today(),ws=w.monday? w.monday(new Date()):now,wd=w.dow?w.dow(new Date()):1;let routine=T.filter(t=>t.work_mode==='routine'),adhoc=T.filter(t=>t.work_mode==='ad_hoc'&&!done(t.status)),project=T.filter(t=>t.work_mode==='project'&&!done(t.status));let due=T.filter(t=>t.work_mode!=='routine'&&t.deadline===now&&!done(t.status));let over=T.filter(t=>t.work_mode!=='routine'&&t.deadline&&t.deadline<now&&!done(t.status));let rtToday=routine.filter(t=>t.weekday_start&&t.weekday_end&&wd>=t.weekday_start&&wd<=t.weekday_end&&!done(w.routineStatus?w.routineStatus(t,ws):t.status));let item=t=>`<div class="day-item"><b>${E(t.name)}</b><div class="small">${t.work_mode==='routine'?'Mỗi tuần '+(w.WD?.[t.weekday_start]||'')+' → '+(w.WD?.[t.weekday_end]||''):(dd(t.execution_date)+' → '+dd(t.deadline))} ${t.deadline?`· <span class="${t.deadline<now?'danger':''}">${deadlineText(t.deadline)}</span>`:''}</div></div>`;let card=(icon,title,arr,sub)=>`<div class="day-card"><div class="day-head"><b>${icon} ${title}</b><span class="pill">${arr.length}</span></div><div class="small">${sub}</div>${arr.slice(0,4).map(item).join('')||'<div class="empty" style="margin-top:10px">Không có việc 🎉</div>'}</div>`;sec.innerHTML=`<div class="card"><div class="head"><div><b>Good morning, Darcy ✦</b><div class="small">Hôm nay có <b>${rtToday.length+adhoc.filter(t=>t.execution_date===now).length+project.filter(t=>t.execution_date===now).length}</b> việc cần xử lý, <b>${due.length}</b> deadline và <b>${over.length}</b> task quá hạn.</div></div></div></div><div class="report-grid"><div class="mini-kpi"><span class="small">Hôm nay</span><b>${rtToday.length+T.filter(t=>t.work_mode!=='routine'&&t.execution_date===now&&!done(t.status)).length}</b><span class="small">Việc cần xử lý</span></div><div class="mini-kpi"><span class="small">Tới hạn hôm nay</span><b>${due.length}</b><span class="small">Deadline hôm nay</span></div><div class="mini-kpi"><span class="small">Quá hạn</span><b class="${over.length?'danger':''}">${over.length}</b><span class="small">Cần ưu tiên</span></div><div class="mini-kpi"><span class="small">Projects</span><b>${P.length}</b><span class="small">Đang quản lý</span></div></div><h2 style="margin:22px 0 8px">My Day</h2><div class="myday">${card('↻','Task cố định',routine,'Việc lặp lại theo tuần')}${card('⚡','Task phát sinh',adhoc,'Việc phát sinh cần xử lý')}${card('▣','Theo Project',project,'Task thuộc các project đang chạy')}<div class="day-card" id="overviewSchedule"><div class="day-head"><b>◷ Lịch trình riêng</b><span class="pill">...</span></div><div class="small">Cuộc hẹn và lịch cá nhân hôm nay</div></div></div>`;loadOverviewSchedule()}
async function loadOverviewSchedule(){try{let a=await w.spaceDB.select('personal_schedule'),x=a.filter(r=>r.event_date===today()),b=$('#overviewSchedule');if(!b)return;b.querySelector('.pill').textContent=x.length;b.insertAdjacentHTML('beforeend',x.slice(0,4).map(r=>`<div class="day-item"><b>${E(r.title)}</b><div class="small">${r.start_time?E(r.start_time.slice(0,5))+' · ':''}${E(r.location||'')}</div></div>`).join('')||'<div class="empty" style="margin-top:10px">Không có lịch hôm nay</div>')}catch(e){}}
// Performance report
async function renderPerfReport(){if(!$('#performance')?.classList.contains('on'))return;try{let type=w.perfType||'facebook',rows=await w.spaceDB.select(type==='facebook'?'performance_facebook':'performance_tiktok');let sec=$('#performance'),names=[...new Set(rows.map(r=>type==='facebook'?r.page:r.channel).filter(Boolean))],views=rows.reduce((a,r)=>a+Number(r.views||0),0),eng=type==='facebook'?rows.reduce((a,r)=>a+Number(r.engagements||0),0):rows.reduce((a,r)=>a+Number(r.likes||0)+Number(r.comments||0)+Number(r.shares||0),0),followers=rows.reduce((a,r)=>a+Number(type==='facebook'?r.followers||0:r.follower_new||0),0),clicks=type==='facebook'?rows.reduce((a,r)=>a+Number(r.link_clicks||0),0):rows.reduce((a,r)=>a+Number(r.profile_views||0),0),max=Math.max(1,...rows.map(r=>Number(r.views||0)));sec.innerHTML=`<div class="card"><div class="head"><div><b>Performance Report</b><div class="small">Dữ liệu → xu hướng → điều cần theo dõi.</div></div><button class="btn primary" id="addMetric">＋ Update Data</button></div><div class="toolbar2"><button class="btn tab ${type==='facebook'?'on':''}" data-px="facebook">Facebook</button><button class="btn tab ${type==='tiktok'?'on':''}" data-px="tiktok">TikTok</button><select id="channelFilter"><option value="">All Channels</option>${names.map(n=>`<option>${E(n)}</option>`).join('')}</select><select id="periodFilter"><option>All data</option><option>Last 4 records</option><option>Last 8 records</option></select></div><div class="report-grid"><div class="mini-kpi"><span class="small">Views</span><b>${views.toLocaleString('vi-VN')}</b><span class="small">Trong dữ liệu đang có</span></div><div class="mini-kpi"><span class="small">Engagement</span><b>${eng.toLocaleString('vi-VN')}</b><span class="small">Tổng tương tác</span></div><div class="mini-kpi"><span class="small">${type==='facebook'?'Followers':'Follower mới'}</span><b>${followers.toLocaleString('vi-VN')}</b><span class="small">Theo bản ghi</span></div><div class="mini-kpi"><span class="small">${type==='facebook'?'Link Clicks':'Profile Views'}</span><b>${clicks.toLocaleString('vi-VN')}</b><span class="small">Theo bản ghi</span></div></div><div class="perf-layout" style="margin-top:14px"><div class="chartbox"><b>Performance Trend · Views</b><div class="bars">${rows.slice(0,10).reverse().map(r=>`<div style="flex:1"><div class="bar" title="${Number(r.views||0).toLocaleString('vi-VN')}" style="height:${Math.max(3,Number(r.views||0)/max*135)}px"></div><div class="barlabel">${E(r.week_label||dd(r.period_start))}</div></div>`).join('')}</div></div><div class="day-card"><b>✦ Darcy’s Insights</b><p class="small">${rows.length<2?'Chưa đủ dữ liệu nhiều kỳ để xác định xu hướng ổn định. Hãy tiếp tục cập nhật performance theo tuần.':`Đang có ${rows.length} bản ghi từ ${names.length} kênh. Dùng bộ lọc để so sánh từng kênh và kỳ.`}</p><p class="small"><b>Nguyên tắc:</b> Insight chỉ hiển thị khi dữ liệu hỗ trợ kết luận.</p></div></div><div class="card" style="box-shadow:none"><b>Channel Performance</b><div id="metricBox" style="margin-top:10px"></div></div><div id="metricForm"></div></div>`;w.perfType=type;$$('[data-px]').forEach(b=>b.onclick=()=>{w.perfType=b.dataset.px;renderPerfReport()});$('#addMetric').onclick=()=>w.metricForm?.();let box=$('#metricBox');box.innerHTML=rows.length?`<table class="metric-table"><thead><tr><th>Kênh</th><th>Kỳ</th><th>Views</th><th>Tương tác</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${E(type==='facebook'?r.page:r.channel)}</b></td><td>${E(r.week_label||dd(r.period_start))}</td><td>${Number(r.views||0).toLocaleString('vi-VN')}</td><td>${Number(type==='facebook'?r.engagements||0:(r.likes||0)+(r.comments||0)+(r.shares||0)).toLocaleString('vi-VN')}</td><td>•••</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Chưa có dữ liệu.</div>'}catch(e){}}
// Library grid
async function renderLibraryGrid(){if(!$('#library')?.classList.contains('on'))return;try{let rows=await w.spaceDB.select('library_resources'),sec=$('#library');sec.innerHTML=`<div class="card"><div class="head"><div><b>Resource Library</b><div class="small">Tài nguyên làm việc của Darcy, gom gọn và mở nhanh.</div></div><button class="btn primary" id="addResource">＋ Resource</button></div><div class="toolbar2"><input id="libSearch" placeholder="Tìm tài liệu..."><select id="libChannel"><option value="">Tất cả Channel</option>${[...new Set(rows.map(r=>r.channel).filter(Boolean))].map(x=>`<option>${E(x)}</option>`).join('')}</select><select id="libType"><option value="">Tất cả loại</option>${[...new Set(rows.map(r=>r.resource_type).filter(Boolean))].map(x=>`<option>${E(x)}</option>`).join('')}</select></div><div id="libraryForm"></div><div class="lib-grid" id="libraryBox"></div></div>`;function draw(){let q=$('#libSearch').value.toLowerCase(),ch=$('#libChannel').value,ty=$('#libType').value,a=rows.filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!ch||r.channel===ch)&&(!ty||r.resource_type===ty));$('#libraryBox').innerHTML=a.map(r=>`<div class="lib-card"><div class="head"><span class="type-badge">${E(r.resource_type||'Resource')}</span><button class="dots" data-menu="${r.id}">•••</button></div><h3>${E(r.name)}</h3><span class="pill" style="width:max-content">${E(r.channel||'Chung')}</span><p class="small desc">${E(r.notes||'')}</p><div class="lib-actions">${r.url?`<a class="linkish" target="_blank" href="${E(r.url)}">Mở tài liệu ↗</a>`:'<span></span>'}<button class="btn" data-editlib="${r.id}">Sửa</button></div></div>`).join('')||'<div class="empty">Không có tài nguyên phù hợp.</div>';$$('[data-editlib]').forEach(b=>b.onclick=()=>w.resourceForm?.(rows.find(x=>x.id===b.dataset.editlib)))}draw();$('#libSearch').oninput=draw;$('#libChannel').onchange=draw;$('#libType').onchange=draw;$('#addResource').onclick=()=>w.resourceForm?.()}catch(e){}}
// Calendar month/week + deadlines + schedules
async function enhanceCalendar(){if(!$('#calendar')?.classList.contains('on'))return;let sec=$('#calendar'),card=sec.querySelector('.card');if(!card)return;let schedules=[];try{schedules=await w.spaceDB.select('personal_schedule')}catch(e){}let toolbar=card.querySelector('.filters');if(toolbar&&!$('#calMode'))toolbar.insertAdjacentHTML('beforebegin','<div class="toolbar2 cal-switch"><button class="btn on" id="calMonthMode">Month</button><button class="btn" id="calWeekMode">Week</button><button class="btn" id="calToday">Today</button><span class="pill">All</span><span class="pill">Routine</span><span class="pill">Project</span><span class="pill">Ad-hoc</span><span class="pill">Schedule</span></div>');function monthExtra(){w.renderCalendar?.();setTimeout(()=>{let box=$('#calendarBox'),ym=$('#calMonth').value;if(!box||!ym)return;let cells=[...box.querySelectorAll('.calday')];cells.forEach(c=>{let n=parseInt(c.firstChild?.textContent||'0'),date=ym+'-'+String(n).padStart(2,'0');(w.D?.tasks||[]).filter(t=>t.work_mode!=='routine'&&t.deadline===date&&t.execution_date!==date).forEach(t=>c.insertAdjacentHTML('beforeend',`<div class="deadline-event"><b>🔴 HẠN · ${E(t.name)}</b><br>${E(t.status||'')}</div>`));schedules.filter(x=>x.event_date===date).forEach(x=>c.insertAdjacentHTML('beforeend',`<div class="schedule-event"><b>◷ ${E(x.title)}</b><br>${x.start_time?E(x.start_time.slice(0,5)):''}</div>`))})},20)}function weekView(){let base=new Date(),wd=(base.getDay()+6)%7;base.setDate(base.getDate()-wd);let dates=[0,1,2,3,4,5,6].map(i=>{let x=new Date(base);x.setDate(base.getDate()+i);return x.toISOString().slice(0,10)});$('#calendarBox').innerHTML=`<div class="week-grid">${dates.map((date,i)=>{let tasks=(w.D?.tasks||[]).filter(t=>t.execution_date===date||t.deadline===date),sch=schedules.filter(x=>x.event_date===date);return `<div class="week-col"><div class="week-date">${['T2','T3','T4','T5','T6','T7','CN'][i]} · ${dd(date)}</div>${tasks.map(t=>`<div class="${t.deadline===date?'deadline-event':'event'}"><b>${t.deadline===date?'🔴 HẠN · ':''}${E(t.name)}</b><br>${t.deadline?deadlineText(t.deadline):E(t.status||'')}</div>`).join('')}${sch.map(x=>`<div class="schedule-event"><b>◷ ${E(x.title)}</b><br>${x.start_time?E(x.start_time.slice(0,5)):''}</div>`).join('')}</div>`}).join('')}</div>`}$('#calMonthMode').onclick=()=>{$('#calMonthMode').classList.add('on');$('#calWeekMode').classList.remove('on');toolbar.style.display='flex';monthExtra()};$('#calWeekMode').onclick=()=>{$('#calWeekMode').classList.add('on');$('#calMonthMode').classList.remove('on');toolbar.style.display='none';weekView()};$('#calToday').onclick=()=>{$('#calMonth').value=today().slice(0,7);monthExtra()};monthExtra();let existing=$('#calendarSummary');if(!existing){let all=w.D?.tasks||[],over=all.filter(t=>t.deadline&&t.deadline<today()&&!done(t.status)),due=all.filter(t=>t.deadline&&t.deadline>=today()).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,5);card.insertAdjacentHTML('afterend',`<div id="calendarSummary" class="summary-grid"><div class="day-card"><b>This month / week</b><div class="report-grid" style="grid-template-columns:repeat(2,1fr);margin-top:10px"><div><b>${all.length}</b><div class="small">Tasks</div></div><div><b>${over.length}</b><div class="small">Overdue</div></div></div></div><div class="day-card"><b>Upcoming Deadlines</b>${due.map(t=>`<div class="day-item"><b>${E(t.name)}</b><div class="small">${dd(t.deadline)} · ${deadlineText(t.deadline)}</div></div>`).join('')||'<div class="small">Chưa có deadline sắp tới.</div>'}</div></div>`)}}
// hook navigation and refresh
$$('.nav button').forEach(b=>b.addEventListener('click',()=>setTimeout(()=>{let p=b.dataset.space;contextHeader(p);if(p==='overview')renderOverview();if(p==='calendar')enhanceCalendar();if(p==='performance')renderPerfReport();if(p==='library')renderLibraryGrid()},80)));const obs=new MutationObserver(()=>{if($('#overview')?.classList.contains('on')&&!$('#overview .myday'))renderOverview()});obs.observe(d.body,{childList:true,subtree:true});setTimeout(()=>{contextHeader('overview');renderOverview()},400);
});
