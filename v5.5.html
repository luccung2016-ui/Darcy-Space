<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darcy's Space V5.5</title><style>html,body,#dash{margin:0;width:100%;height:100%;border:0;background:#f6f7f9}body{overflow:hidden}#dash{display:block}</style></head><body><iframe id="dash" src="v5.3.html" title="Darcy's Space"></iframe><script>
const frame=document.getElementById('dash');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;
const css=d.createElement('style');css.textContent=`.brand-space{font-size:20px;font-weight:800}.brand-sub{display:block;margin-top:3px;font-size:11px;opacity:.72}.side{min-width:235px}.workspace-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.resource-card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:8px 0;background:#fff}.resource-card:hover{border-color:#d1d5db}.deadline-note{font-weight:800;color:#b42318}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tab.on{background:#20242b;color:white}.space-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;padding:16px;border:1px solid #e5e7eb;border-radius:12px;background:#fafafa}.space-form label{font-size:11px;font-weight:700;color:#707784;display:grid;gap:5px}.space-form .full{grid-column:1/-1}.space-form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.linkish{color:#b42318;text-decoration:none;font-weight:700}.metric-table td,.metric-table th{white-space:nowrap}@media(max-width:700px){.workspace-grid,.space-form{grid-template-columns:1fr}.space-form .full{grid-column:auto}}`;d.head.appendChild(css);d.title="Darcy's Space";
const bridge=d.createElement('script');bridge.textContent=`window.spaceDB={select:async(t)=>{const{data,error}=await sb.from(t).select('*').order('created_at',{ascending:false});if(error)throw error;return data||[]},save:async(t,p,id)=>{const q=id?sb.from(t).update(p).eq('id',id):sb.from(t).insert(p);const{error}=await q;if(error)throw error},del:async(t,id)=>{const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error}};`;d.body.appendChild(bridge);
const login=d.querySelector('#login .loginbox');if(login){login.querySelector('h1').textContent="Darcy's Space";login.querySelector('h2').textContent='Welcome back, Darcy ✦';login.querySelector('p.muted').textContent='Mọi công việc, kế hoạch và tài nguyên của Darcy ở cùng một nơi.'}
const side=d.querySelector('.side');side.innerHTML=`<div class="brand-space">Darcy's Space</div><small class="brand-sub">your personal workspace ✦</small><nav class="nav"><button class="on" data-space="overview">⌂ <span>Overview</span></button><button data-space="calendar">▦ <span>Calendar</span></button><button data-space="work">☷ <span>Project & Task</span></button><button data-space="performance">⌁ <span>Performance</span></button><button data-space="library">▤ <span>Library</span></button><button data-space="schedule">◷ <span>Schedule</span></button></nav>`;
const main=d.querySelector('.main'),tasks=d.querySelector('#tasks'),projects=d.querySelector('#projects');if(tasks&&projects){const h=d.createElement('div');h.innerHTML='<div class="card"><div class="head"><div><b>Projects</b><div class="small">Project và task con trong cùng workspace.</div></div><button class="btn primary" id="spaceNewProject">＋ Project</button></div><div id="spaceProjects"></div></div>';tasks.appendChild(h);const box=h.querySelector('#spaceProjects');while(projects.firstChild)box.appendChild(projects.firstChild);projects.remove();setTimeout(()=>{d.querySelector('#spaceNewProject').onclick=()=>d.querySelector('#quickProject')?.click()},0)}
function view(id,html){let s=d.createElement('section');s.id=id;s.className='view';s.innerHTML=html;main.appendChild(s);return s}
view('performance',`<div class="card"><div class="head"><div><b>Performance</b><div class="small">Hiệu quả kênh + Content Insights trong cùng một flow.</div></div><button class="btn primary" id="addMetric">＋ Thêm số liệu</button></div><div class="toolbar" style="margin-top:14px"><button class="btn tab on" data-pt="facebook">Facebook</button><button class="btn tab" data-pt="tiktok">TikTok</button></div><div id="metricForm"></div><div id="metricBox"></div></div>`);
view('library',`<div class="card"><div class="head"><div><b>Library</b><div class="small">Content Direction, Calendar, Guideline, source và tài nguyên cố định.</div></div><button class="btn primary" id="addResource">＋ Thêm tài nguyên</button></div><div id="libraryForm"></div><div id="libraryBox"></div></div>`);
view('schedule',`<div class="card"><div class="head"><div><b>Schedule</b><div class="small">Lịch trình riêng và cuộc hẹn của Darcy.</div></div><button class="btn primary" id="addSchedule">＋ Thêm lịch trình</button></div><div id="scheduleForm"></div><div id="scheduleBox"></div></div>`);
const title=d.querySelector('#title'),subtitle=title?.nextElementSibling;function show(id,label){d.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));d.getElementById(id)?.classList.add('on');d.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.space===label));title.textContent=label==='work'?'Project & Task':label[0].toUpperCase()+label.slice(1);const cp={overview:'Mọi thứ Darcy cần xử lý hôm nay, gói gọn trong một màn hình.',calendar:'Nhìn nhanh ngày bắt đầu và deadline.',work:'Task cố định, task phát sinh và Projects trong cùng workspace.',performance:'Theo dõi hiệu quả và rút insight từ dữ liệu.',library:'Tài nguyên cố định, dễ tìm và mở nhanh.',schedule:'Lịch trình riêng và các cuộc hẹn của Darcy.'};if(subtitle)subtitle.textContent=cp[label]||'';if(label==='performance')loadMetrics();if(label==='library')loadLibrary();if(label==='schedule')loadSchedule()}
d.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{let x=b.dataset.space;show(x==='work'?'tasks':x,x)});show('overview','overview');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let perfType='facebook',metricRows=[],libraryRows=[],scheduleRows=[];
function resourceForm(r={}){d.querySelector('#libraryForm').innerHTML=`<form id="rf" class="space-form"><label>Tên tài nguyên<input name="name" required value="${E(r.name||'')}"></label><label>Fanpage / Channel<input name="channel" value="${E(r.channel||'')}"></label><label>Loại tài liệu<select name="resource_type"><option>Content Direction</option><option>Content Calendar</option><option>Visual Guideline</option><option>Source / Folder</option><option>Khác</option></select></label><label>Link<input name="url" type="url" value="${E(r.url||'')}"></label><label class="full">Ghi chú<textarea name="notes">${E(r.notes||'')}</textarea></label><div class="space-form-actions"><button type="button" class="btn" id="cancelRF">Hủy</button><button class="btn primary">Lưu tài nguyên</button></div></form>`;let f=d.querySelector('#rf');f.resource_type.value=r.resource_type||'Content Direction';d.querySelector('#cancelRF').onclick=()=>d.querySelector('#libraryForm').innerHTML='';f.onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(f));await w.spaceDB.save('library_resources',p,r.id);d.querySelector('#libraryForm').innerHTML='';loadLibrary()}}
async function loadLibrary(){try{libraryRows=await w.spaceDB.select('library_resources');d.querySelector('#libraryBox').innerHTML=libraryRows.length?libraryRows.map(r=>`<div class="resource-card"><div class="head"><div><b>${E(r.name)}</b><div class="small">${E(r.channel||'Chung')} · ${E(r.resource_type||'Tài nguyên')}</div></div><div><button class="btn" data-re="${r.id}">Sửa</button> <button class="btn" data-rd="${r.id}">Xóa</button></div></div>${r.url?`<p><a class="linkish" target="_blank" href="${E(r.url)}">Mở tài liệu ↗</a></p>`:''}<div class="small">${E(r.notes||'')}</div></div>`).join(''):'<div class="empty">Chưa có tài nguyên. Bấm “＋ Thêm tài nguyên” để tạo.</div>';d.querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>resourceForm(libraryRows.find(x=>x.id===b.dataset.re)));d.querySelectorAll('[data-rd]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa tài nguyên này?')){await w.spaceDB.del('library_resources',b.dataset.rd);loadLibrary()}})}catch(e){d.querySelector('#libraryBox').innerHTML='<div class="empty">⚠ '+E(e.message)+'</div>'}}
d.querySelector('#addResource').onclick=()=>resourceForm();
function scheduleForm(r={}){d.querySelector('#scheduleForm').innerHTML=`<form id="sf" class="space-form"><label>Tên lịch trình<input name="title" required value="${E(r.title||'')}"></label><label>Ngày<input name="event_date" type="date" required value="${E(r.event_date||'')}"></label><label>Giờ bắt đầu<input name="start_time" type="time" value="${E((r.start_time||'').slice(0,5))}"></label><label>Giờ kết thúc<input name="end_time" type="time" value="${E((r.end_time||'').slice(0,5))}"></label><label>Địa điểm<input name="location" value="${E(r.location||'')}"></label><label>Nhắc trước (phút)<input name="reminder_minutes" type="number" min="0" value="${E(r.reminder_minutes??'')}"></label><label class="full">Link liên quan<input name="url" type="url" value="${E(r.url||'')}"></label><label class="full">Ghi chú<textarea name="notes">${E(r.notes||'')}</textarea></label><div class="space-form-actions"><button type="button" class="btn" id="cancelSF">Hủy</button><button class="btn primary">Lưu lịch trình</button></div></form>`;let f=d.querySelector('#sf');d.querySelector('#cancelSF').onclick=()=>d.querySelector('#scheduleForm').innerHTML='';f.onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(f));['start_time','end_time','url','location','notes'].forEach(k=>{if(!p[k])p[k]=null});p.reminder_minutes=p.reminder_minutes===''?null:Number(p.reminder_minutes);await w.spaceDB.save('personal_schedule',p,r.id);d.querySelector('#scheduleForm').innerHTML='';loadSchedule()}}
async function loadSchedule(){try{scheduleRows=await w.spaceDB.select('personal_schedule');scheduleRows.sort((a,b)=>(a.event_date+a.start_time).localeCompare(b.event_date+b.start_time));d.querySelector('#scheduleBox').innerHTML=scheduleRows.length?scheduleRows.map(r=>`<div class="resource-card"><div class="head"><div><b>${E(r.title)}</b><div class="small">📅 ${E(r.event_date)} ${r.start_time?'· '+E(r.start_time.slice(0,5)):''}${r.end_time?' → '+E(r.end_time.slice(0,5)):''}</div></div><div><button class="btn" data-se="${r.id}">Sửa</button> <button class="btn" data-sd="${r.id}">Xóa</button></div></div><div class="small">${r.location?'📍 '+E(r.location)+' · ':''}${r.reminder_minutes!=null?'🔔 trước '+E(r.reminder_minutes)+' phút':''}</div>${r.notes?`<p>${E(r.notes)}</p>`:''}</div>`).join(''):'<div class="empty">Chưa có lịch trình riêng.</div>';d.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>scheduleForm(scheduleRows.find(x=>x.id===b.dataset.se)));d.querySelectorAll('[data-sd]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa lịch trình này?')){await w.spaceDB.del('personal_schedule',b.dataset.sd);loadSchedule()}})}catch(e){d.querySelector('#scheduleBox').innerHTML='<div class="empty">⚠ '+E(e.message)+'</div>'}}
d.querySelector('#addSchedule').onclick=()=>scheduleForm();
function metricForm(r={}){let fb=perfType==='facebook',name=fb?'page':'channel';d.querySelector('#metricForm').innerHTML=`<form id="mf" class="space-form"><label>${fb?'Fanpage':'TikTok Channel'}<input name="${name}" required value="${E(r[name]||'')}"></label><label>Tuần / nhãn kỳ<input name="week_label" value="${E(r.week_label||'')}"></label><label>Từ ngày<input type="date" name="period_start" required value="${E(r.period_start||'')}"></label><label>Đến ngày<input type="date" name="period_end" value="${E(r.period_end||'')}"></label>${fb?`<label>Followers<input type="number" name="followers" value="${E(r.followers??0)}"></label><label>Views<input type="number" name="views" value="${E(r.views??0)}"></label><label>Visits<input type="number" name="visits" value="${E(r.visits??0)}"></label><label>Engagements<input type="number" name="engagements" value="${E(r.engagements??0)}"></label><label>Link Clicks<input type="number" name="link_clicks" value="${E(r.link_clicks??0)}"></label><label>Conversations<input type="number" name="conversations" value="${E(r.conversations??0)}"></label>`:`<label>Follower mới<input type="number" name="follower_new" value="${E(r.follower_new??0)}"></label><label>Video Views<input type="number" name="views" value="${E(r.views??0)}"></label><label>Profile Views<input type="number" name="profile_views" value="${E(r.profile_views??0)}"></label><label>Likes<input type="number" name="likes" value="${E(r.likes??0)}"></label><label>Comments<input type="number" name="comments" value="${E(r.comments??0)}"></label><label>Shares<input type="number" name="shares" value="${E(r.shares??0)}"></label>`}<label class="full">Ghi chú<textarea name="notes">${E(r.notes||'')}</textarea></label><div class="space-form-actions"><button type="button" class="btn" id="cancelMF">Hủy</button><button class="btn primary">Lưu số liệu</button></div></form>`;let f=d.querySelector('#mf');d.querySelector('#cancelMF').onclick=()=>d.querySelector('#metricForm').innerHTML='';f.onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(f));Object.keys(p).forEach(k=>{if(k!=='page'&&k!=='channel'&&k!=='week_label'&&k!=='period_start'&&k!=='period_end'&&k!=='notes'&&p[k]!=='')p[k]=Number(p[k]);if(p[k]==='')p[k]=null});await w.spaceDB.save(fb?'performance_facebook':'performance_tiktok',p,r.id);d.querySelector('#metricForm').innerHTML='';loadMetrics()}}
async function loadMetrics(){let table=perfType==='facebook'?'performance_facebook':'performance_tiktok';try{metricRows=await w.spaceDB.select(table);d.querySelector('#metricBox').innerHTML=metricRows.length?'<table class="metric-table"><thead><tr><th>Kênh</th><th>Kỳ</th><th>Views</th><th>Tương tác</th><th></th></tr></thead><tbody>'+metricRows.map(r=>`<tr><td><b>${E(r.page||r.channel)}</b></td><td>${E(r.week_label||r.period_start)}</td><td>${E(r.views||0)}</td><td>${E(perfType==='facebook'?(r.engagements||0):((r.likes||0)+(r.comments||0)+(r.shares||0)))}</td><td><button class="btn" data-me="${r.id}">Sửa</button> <button class="btn" data-md="${r.id}">Xóa</button></td></tr>`).join('')+'</tbody></table>':'<div class="empty">Chưa có dữ liệu '+(perfType==='facebook'?'Facebook':'TikTok')+'.</div>';d.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>metricForm(metricRows.find(x=>x.id===b.dataset.me)));d.querySelectorAll('[data-md]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa bản ghi này?')){await w.spaceDB.del(table,b.dataset.md);loadMetrics()}})}catch(e){d.querySelector('#metricBox').innerHTML='<div class="empty">⚠ '+E(e.message)+'</div>'}}
d.querySelector('#addMetric').onclick=()=>metricForm();d.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{perfType=b.dataset.pt;d.querySelectorAll('[data-pt]').forEach(x=>x.classList.toggle('on',x===b));d.querySelector('#metricForm').innerHTML='';loadMetrics()});
const mo=new MutationObserver(()=>d.querySelectorAll('#taskBox tbody tr').forEach(tr=>{let c=tr.querySelectorAll('td')[3];if(c&&c.textContent.includes('→')&&!c.querySelector('.deadline-note')){let p=c.textContent.split('→');if(p.length===2)c.innerHTML=`<span>${p[0].trim()}</span> → <span class="deadline-note">${p[1].trim()}</span>`}}));mo.observe(d.body,{childList:true,subtree:true});
});</script></body></html>
