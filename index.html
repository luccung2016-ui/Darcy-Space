<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Darcy's Space</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <section id="login" class="login">
      <div class="loginbox">
        <h1 style="color: var(--r)">Darcy's Space</h1>
        <h2>Chào mừng trở lại, Darcy ✦</h2>
        <p class="muted">Mọi công việc, kế hoạch và tài nguyên của Darcy ở cùng một nơi.</p>
        <input id="email" type="email" placeholder="Email" /><input
          id="password"
          type="password"
          placeholder="Mật khẩu"
        /><button id="loginBtn" class="btn primary" style="width: 100%">Đăng nhập</button>
        <p id="loginMsg" class="small"></p>
      </div>
    </section>

    <div id="app" class="app">
      <aside class="side">
        <div class="brand-space">Darcy's Space</div>
        <small class="brand-sub">không gian làm việc của Darcy ✦</small>
        <nav class="nav">
          <button class="on" data-space="overview" title="Tổng quan" aria-label="Tổng quan">⌂ <span class="nav-full">Tổng quan</span><span class="nav-short" aria-hidden="true">Tổng quan</span></button>
          <button data-space="calendar" title="Lịch tổng" aria-label="Lịch tổng">▦ <span class="nav-full">Lịch tổng</span><span class="nav-short" aria-hidden="true">Lịch</span></button>
          <button data-space="work" title="Công việc" aria-label="Công việc">☷ <span class="nav-full">Công việc</span><span class="nav-short" aria-hidden="true">Việc</span></button>
          <button data-space="performance" title="Hiệu quả kênh" aria-label="Hiệu quả kênh">⌁ <span class="nav-full">Hiệu quả kênh</span><span class="nav-short" aria-hidden="true">Số liệu</span></button>
          <button data-space="library" title="Thư viện" aria-label="Thư viện">▤ <span class="nav-full">Thư viện</span><span class="nav-short" aria-hidden="true">Tài liệu</span></button>
          <button data-space="schedule" title="Lịch trình" aria-label="Lịch trình">◷ <span class="nav-full">Lịch trình</span><span class="nav-short" aria-hidden="true">Lịch hẹn</span></button>
        </nav>
      </aside>
      <main class="main">
        <header class="top">
          <div>
            <h1 id="title">Tổng quan</h1>
            <p class="muted" id="subtitle">Hôm nay Darcy cần quan tâm điều gì?</p>
          </div>
          <div class="actions" id="topActions"></div>
        </header>
        <p><span id="dbState" class="pill">Đang kết nối...</span></p>

        <section id="overview" class="view on"></section>
        <section id="calendar" class="view"></section>
        <section id="tasks" class="view">
          <div id="projectInWork">
            <div class="card">
              <div class="head">
                <div>
                  <b>Project</b>
                  <div class="small">Project và task con trong cùng một nơi.</div>
                </div>
              </div>
              <div id="projectCards58" class="projectgrid"></div>
            </div>
          </div>
          <div class="card">
            <div class="head"><b>Công việc</b></div>
            <div class="filters">
              <input id="taskSearch" placeholder="Tìm task..." /><select id="taskMode">
                <option value="">Tất cả loại</option>
                <option value="routine">Task cố định</option>
                <option value="project">Theo project</option>
                <option value="ad_hoc">Phát sinh</option>
              </select>
            </div>
            <div id="taskBox"></div>
          </div>
        </section>
        <section id="performance" class="view"></section>
        <section id="library" class="view"></section>
        <section id="schedule" class="view"></section>
      </main>
    </div>

    <!-- Task / project form -->
    <div id="modalBg" class="modalbg">
      <div class="modal">
        <div class="head">
          <div>
            <b id="formTitle"></b>
            <div id="formHint" class="small"></div>
          </div>
          <button class="btn" id="closeModal">✕</button>
        </div>
        <div id="dynamicForm" class="form"></div>
        <div id="children"></div>
        <div class="actions" style="justify-content: flex-end; margin-top: 14px">
          <span id="saveState" class="small"></span><button id="deleteBtn" class="btn">Xóa</button
          ><button id="saveBtn" class="btn primary">Lưu & cập nhật</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
