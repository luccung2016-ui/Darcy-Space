<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PNE Dashboard - Kiểm tra đăng nhập</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7f9;margin:0;display:grid;place-items:center;min-height:100vh;color:#20242b}.box{width:min(430px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 8px 30px #10182812}h1{color:#d12026;margin-bottom:4px}input,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #e5e7eb;font:inherit}button{background:#d12026;color:#fff;font-weight:700;cursor:pointer}#msg{font-size:13px;line-height:1.5;min-height:20px}.ok{color:#198754}.err{color:#b42318}</style></head><body><div class="box"><h1>PNE</h1><h2>Kiểm tra đăng nhập Dashboard</h2><p>Trang này dùng để tách riêng lỗi đăng nhập khỏi Dashboard V5.1.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mật khẩu"><button id="btn">Đăng nhập thử</button><p id="msg">Đang tải kết nối Supabase...</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const msg=document.getElementById('msg'),btn=document.getElementById('btn');try{if(!window.supabase)throw new Error('Không tải được thư viện Supabase');const sb=window.supabase.createClient('https://dqxbyikczcfqinxobvsq.supabase.co','sb_publishable_MOlWnlepLFI8sAyCbEYgJw_cVkskGNk');msg.textContent='✓ Kết nối đăng nhập đã sẵn sàng';msg.className='ok';async function login(){msg.textContent='Đang đăng nhập...';msg.className='';btn.disabled=true;try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)throw new Error('Vui lòng nhập đủ email và mật khẩu.');const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw new Error('Không tạo được phiên đăng nhập.');msg.textContent='✓ Đăng nhập thành công. Lỗi nằm ở code V5.1, không phải tài khoản.';msg.className='ok'}catch(e){msg.textContent='⚠ '+e.message;msg.className='err'}finally{btn.disabled=false}}btn.onclick=login;document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()})}catch(e){msg.textContent='⚠ '+e.message;msg.className='err'}</script></body></html>
