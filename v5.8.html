.dataset.libedit)))}function resourceForm(r={}){$('#libForm58').innerHTML=`<form id="rf58" class="form58"><label>Tên tài nguyên<input name="name" required value="${E(r.name||'')}"></label><label>Fanpage / Channel<input name="channel" value="${E(r.channel||'')}"></label><label>Loại tài liệu<select name="resource_type">${['Content Direction','Content Calendar','Visual Guideline','Source / Folder','Khác'].map(x=>`<option ${r.resource_type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Link<input name="url" type="url" value="${E(r.url||'')}"></label><label class="full">Ghi chú<textarea name="notes">${E(r.notes||'')}</textarea></label><div class="formactions">${r.id?'<button type="button" class="btn" id="rfDel">Xóa</button>':''}<button type="button" class="btn" id="rfCancel">Hủy</button><button class="btn primary">Lưu</button></div></form>`;let f=$('#rf58');$('#rfCancel').onclick=()=>$('#libForm58').innerHTML='';$('#rfDel')?.addEventListener('click',async()=>{if(confirm('Xóa tài nguyên này?')){await w.darcyDB.del('library_resources',r.id);library()}});f.onsubmit=async e=>{e.preventDefault();await w.darcyDB.save('library_resources',Object.fromEntries(new FormData(f)),r.id);library()}}

let ptype='facebook',prows=[];async function performance(){try{prows=await w.darcyDB.select(ptype==='facebook'?'performance_facebook':'performance_tiktok')}catch(e){prows=[]}let names=[...new Set(prows.map(r=>ptype==='facebook'?r.page:r.channel).filter(Boolean))];$('#performance').innerHTML=`<div class="card"><div class="head"><div><b>Performance Report</b><div class="small">KPI → Trend → Channel Performance → Darcy's Insights.</div></div><button class="btn primary" id="perfAdd58">＋ Update Data</button></div><div class="contextbar" style="margin-top:14px"><div class="seg"><button id="fb58" class="${ptype==='facebook'?'on':''}">Facebook</button><button id="tt58" class="${ptype==='tiktok'?'on':''}">TikTok</button></div><select id="perfCh58"><option value="">Tất cả Channel</option>${names.map(x=>`<option>${E(x)}</option>`).join('')}</select><select id="perfRange58"><option value="0">Tất cả kỳ</option><option value="4">4 kỳ gần nhất</option><option value="8">8 kỳ gần nhất</option></select></div><div id="perfForm58"></div><div id="perfBody58"></div></div>`;$('#fb58').onclick=()=>{ptype='facebook';performance()};$('#tt58').onclick=()=>{ptype='tiktok';performance()};$('#perfAdd58').onclick=()=>metricForm();$('#perfCh58').onchange=drawPerf;$('#perfRange58').onchange=drawPerf;drawPerf()}function drawPerf(){let ch=$('#perfCh58').value,n=Number($('#perfRange58').value),rows=prows.filter(r=>!ch||(ptype==='facebook'?r.page:r.channel)===ch).sort((a,b)=>(a.period_start||'').localeCompare(b.period_start||''));if(n)rows=rows.slice(-n);let views=rows.reduce((a,r)=>a+Number(r.views||0),0),eng=rows.reduce((a,r)=>a+Number(ptype==='facebook'?r.engagements||0:(r.likes||0)+(r.comments||0)+(r.shares||0)),0),click=rows.reduce((a,r)=>a+Number(ptype==='facebook'?r.link_clicks||0:r.profile_views||0),0),foll=ptype==='facebook'?(rows.length?Number(rows[rows.length-1].followers||0):0):rows.reduce((a,r)=>a+Number(r.follower_new||0),0),max=Math.max(1,...rows.map(r=>Number(r.views||0))),channels=[...new Set(rows.map(r=>ptype==='facebook'?r.page:r.channel).filter(Boolean))];$('#perfBody58').innerHTML=`<div class="report-grid"><div class="metric"><span class="small">Views</span><b>${views.toLocaleString('vi-VN')}</b><span class="small">Tổng trong kỳ chọn</span></div><div class="metric"><span class="small">Engagement</span><b>${eng.toLocaleString('vi-VN')}</b><span class="small">Tổng tương tác</span></div><div class="metric"><span class="small">${ptype==='facebook'?'Followers':'Follower mới'}</span><b>${foll.toLocaleString('vi-VN')}</b><span class="small">${ptype==='facebook'?'Bản ghi mới nhất':'Tổng trong kỳ'}</span></div><div class="metric"><span class="small">${ptype==='facebook'?'Link Clicks':'Profile Views'}</span><b>${click.toLocaleString('vi-VN')}</b><span class="small">Tổng trong kỳ chọn</span></div></div><div class="perf-main"><div class="chart"><b>Performance Trend · Views</b><div class="bars">${rows.map(r=>`<div class="barwrap"><div class="bar" style="height:${Math.max(3,Number(r.views||0)/max*135)}px" title="${Number(r.views||0).toLocaleString('vi-VN')}"></div><div class="barlab">${E(r.week_label||dd(r.period_start))}</div></div>`).join('')}</div></div><div class="panel"><b>✦ Darcy's Insights</b><p class="small">${rows.length<2?'Cần ít nhất 2 kỳ dữ liệu để đọc xu hướng. Hiện chưa đủ dữ liệu để kết luận tăng/giảm.':`Có ${rows.length} bản ghi từ ${channels.length} kênh trong phạm vi đang chọn. Biểu đồ phía trái phản ánh Views theo từng kỳ.`}</p><p class="small">Không tự suy diễn hiệu quả Content/Pillar khi chưa có dữ liệu performance ở cấp bài viết.</p></div></div><div class="panel subcard"><b>Channel Performance</b><table><thead><tr><th>Kênh</th><th>Kỳ</th><th>Views</th><th>Engagement</th><th>ER</th><th></th></tr></thead><tbody>${rows.map(r=>{let e=Number(ptype==='facebook'?r.engagements||0:(r.likes||0)+(r.comments||0)+(r.shares||0)),v=Number(r.views||0);return `<tr><td><b>${E(ptype==='facebook'?r.page:r.channel)}</b></td><td>${E(r.week_label||dd(r.period_start))}</td><td>${v.toLocaleString('vi-VN')}</td><td>${e.toLocaleString('vi-VN')}</td><td>${v?(e/v*100).toFixed(2)+'%':'—'}</td><td><button class="ellipsis" data-pedit="${r.id}">•••</button></td></tr>`}).join('')}</tbody></table></div>`;$$('[data-pedit]').forEach(b=>b.onclick=()=>metricForm(prows.find(x=>x.id===b.dataset.pedit)))}function metricForm(r={}){let fb=ptype==='facebook',name=fb?'page':'channel';$('#perfForm58').innerHTML=`<form id="mf58" class="form58"><label>${fb?'Fanpage':'TikTok Channel'}<input name="${name}" required value="${E(r[name]||'')}"></label><label>Nhãn kỳ<input name="week_label" value="${E(r.week_label||'')}"></label><label>Từ ngày<input type="date" name="period_start" required value="${E(r.period_start||'')}"></label><label>Đến ngày<input type="date" name="period_end" value="${E(r.period_end||'')}"></label>${fb?`<label>Followers<input type="number" name="followers" value="${E(r.followers??0)}"></label><label>Views<input type="number" name="views" value="${E(r.views??0)}"></label><label>Engagements<input type="number" name="engagements" value="${E(r.engagements??0)}"></label><label>Link Clicks<input type="number" name="link_clicks" value="${E(r.link_clicks??0)}"></label>`:`<label>Follower mới<input type="number" name="follower_new" value="${E(r.follower_new??0)}"></label><label>Video Views<input type="number" name="views" value="${E(r.views??0)}"></label><label>Profile Views<input type="number" name="profile_views" value="${E(r.profile_views??0)}"></label><label>Likes<input type="number" name="likes" value="${E(r.likes??0)}"></label><label>Comments<input type="number" name="comments" value="${E(r.comments??0)}"></label><label>Shares<input type="number" name="shares" value="${E(r.shares??0)}"></label>`}<label class="full">Ghi chú<textarea name="notes">${E(r.notes||'')}</textarea></label><div class="formactions">${r.id?'<button type="button" class="btn" id="mfDel">Xóa</button>':''}<button type="button" class="btn" id="mfCancel">Hủy</button><button class="btn primary">Lưu số liệu</button></div></form>`;let f=$('#mf58');$('#mfCancel').onclick=()=>$('#perfForm58').innerHTML='';$('#mfDel')?.addEventListener('click',async()=>{if(confirm('Xóa bản ghi này?')){await w.darcyDB.del(fb?'performance_facebook':'performance_tiktok',r.id);performance()}});f.onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(f));Object.keys(p).forEach(k=>{if(![name,'week_label','period_start','period_end','notes'].includes(k)&&p[k]!=='')p[k]=Number(p[k]);if(p[k]==='')p[k]=null});await w.darcyDB.save(fb?'performance_facebook':'performance_tiktok',p,r.id);performance()}}
// Schedule
let schedules=[];async function schedule(){try{schedules=await w.darcyDB.select('personal_schedule');schedules.sort((a,b)=>(a.event_date+(a.start_time||'')).localeCompare(b.event_date+(b.start_time||'')))}catch(e){schedules=[]}$('#schedule').innerHTML=`<div class="card"><div class="head"><div><b>Schedule</b><div class="small">Lịch trình riêng và cuộc hẹn của Darcy.</div></div><button class="btn primary" id="schAdd58">＋ Schedule</button></div><div id="schForm58"></div><div>${schedules.map(x=>`<div class="panel" style="margin-top:10px"><div class="panel-head"><div><b>${E(x.title)}</b><div class="small">${dd(x.event_date)} ${x.start_time?'· '+x.start_time.slice(0,5):''}${x.end_time?' → '+x.end_time.slice(0,5):''}</div></div><button class="ellipsis" data-sedit="${x.id}">•••</button></div><div class="small">${x.location?'📍 '+E(x.location)+' · ':''}${x.reminder_minutes!=null?'🔔 trước '+x.reminder_minutes+' phút':''}</div></div>`).join('')||'<div class="empty">Chưa có lịch trình.</div>'}</div></div>`;$('#schAdd58').onclick=()=>scheduleForm();$$('[data-sedit]').forEach(b=>b.onclick=()=>scheduleForm(schedules.find(x=>x.id===b.dataset.sedit)))}function scheduleForm(r={}){$('#schForm58').innerHTML=`<form id="sf58" class="form58"><label>Tên lịch trình<input name="title" required value="${E(r.title||'')}"></label><label>Ngày<input type="date" name="event_date" required value="${E(r.event_date||'')}"></label><label>Giờ bắt đầu<input type="time" name="start_time" value="${E((r.start_time||'').slice(0,5))}"></label><label>Giờ kết thúc<input type="time" name="end_time" value="${E((r.end_time||'').slice(0,5))}"></label><label>Địa điểm<input name="location" value="${E(r.location||'')}"></label><label>Nhắc trước (phút)<input type="number" min="0" name="reminder_minutes" value="${E(r.reminder_minutes??'')}"></label><label class="full">Link liên quan<input type="url" name="url" value="${E(r.url||'')}"></label><label class="full">Ghi chú<textarea name="notes">${E(r.notes||'')}</textarea></label><div class="formactions">${r.id?'<button type="button" class="btn" id="sfDel">Xóa</button>':''}<button type="button" class="btn" id="sfCancel">Hủy</button><button class="btn primary">Lưu lịch trình</button></div></form>`;let f=$('#sf58');$('#sfCancel').onclick=()=>$('#schForm58').innerHTML='';$('#sfDel')?.addEventListener('click',async()=>{if(confirm('Xóa lịch trình này?')){await w.darcyDB.del('personal_schedule',r.id);schedule()}});f.onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(f));['start_time','end_time','url','location','notes'].forEach(k=>{if(!p[k])p[k]=null});p.reminder_minutes=p.reminder_minutes===''?null:Number(p.reminder_minutes);await w.darcyDB.save('personal_schedule',p,r.id);schedule()}}
// keep redesigned views fresh after core sync
const oldSync=$('#syncBtn');oldSync?.addEventListener('click',()=>setTimeout(()=>{let active=$$('.nav button').find(b=>b.classList.contains('on'))?.dataset.space||'overview';show(active)},700));setTimeout(()=>{show('overview')},500);
});
</script></body></html>
