<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darcy's Space</title><style>html,body,#dash{margin:0;width:100%;height:100%;border:0;background:#f6f7f9}body{overflow:hidden}#dash{display:block}</style></head><body><iframe id="dash" src="v5.3.html" title="Darcy's Space"></iframe><script>
const frame=document.getElementById('dash');
frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 const css=d.createElement('style');css.textContent=`
 .brand-space{font-size:20px;font-weight:800;letter-spacing:-.4px}.brand-sub{display:block;margin-top:3px;font-size:11px;opacity:.72}.nav-divider{height:1px;background:#ffffff24;margin:10px 5px}.coming-card{padding:26px!important}.coming-icon{font-size:28px;margin-bottom:8px}.integrated-projects{margin-top:20px}.integrated-projects>.card{margin-top:0}.deadline-note{font-weight:700;color:#b42318}.side{min-width:235px}
 `;d.head.appendChild(css);
 d.title="Darcy's Space";
 const login=d.querySelector('#login .loginbox');if(login){const h1=login.querySelector('h1'),h2=login.querySelector('h2'),p=login.querySelector('p.muted');if(h1){h1.textContent="Darcy's Space";h1.style.letterSpacing='-1px'}if(h2)h2.textContent='Welcome back, Darcy ✦';if(p)p.textContent='Mọi công việc, kế hoạch và tài nguyên của Darcy ở cùng một nơi.'}
 const side=d.querySelector('.side');if(side){side.innerHTML=`<div class="brand-space">Darcy's Space</div><small class="brand-sub">your personal workspace ✦</small><nav class="nav"><button class="on" data-space="overview">⌂ <span>Overview</span></button><button data-space="calendar">▦ <span>Calendar</span></button><button data-space="work">☷ <span>Project & Task</span></button><button data-space="performance">⌁ <span>Performance</span></button><button data-space="library">▤ <span>Library</span></button><button data-space="schedule">◷ <span>Schedule</span></button></nav>`}
 const main=d.querySelector('.main');
 const tasks=d.querySelector('#tasks'),projects=d.querySelector('#projects');
 if(tasks&&projects){const holder=d.createElement('div');holder.className='integrated-projects';holder.innerHTML='<div class="head"><div><b>Projects</b><div class="small">Project và task con được quản lý chung tại một workspace.</div></div><button class="btn primary" id="spaceNewProject">＋ Project</button></div>';while(projects.firstChild)holder.appendChild(projects.firstChild);tasks.appendChild(holder);projects.remove();setTimeout(()=>{const b=d.querySelector('#spaceNewProject');if(b)b.onclick=()=>d.querySelector('#quickProject')?.click()},0)}
 function addView(id,title,body){if(d.getElementById(id))return;const s=d.createElement('section');s.id=id;s.className='view';s.innerHTML=`<div class="card coming-card">${body}</div>`;main.appendChild(s)}
 addView('performance','Performance',`<div class="coming-icon">⌁</div><h2>Performance</h2><p class="muted">Hiệu quả kênh và Content Insights sẽ được gom tại đây để xem dữ liệu → nhận định → hướng cải thiện trong cùng một flow.</p><div class="filters"><button class="btn">Overview</button><button class="btn">Facebook</button><button class="btn">TikTok</button><button class="btn">Content Insights</button></div>`);
 addView('library','Library',`<div class="coming-icon">▤</div><h2>Library</h2><p class="muted">Không gian lưu Content Direction, Content Calendar, Visual Guideline, folder source và các tài nguyên cố định theo từng fanpage/channel.</p><button class="btn primary">＋ Thêm tài nguyên</button>`);
 addView('schedule','Schedule',`<div class="coming-icon">◷</div><h2>Schedule</h2><p class="muted">Không gian dành cho lịch trình riêng, cuộc hẹn và reminder cá nhân. Sau này các lịch quan trọng có thể đi chung vào Calendar và Telegram.</p><button class="btn primary">＋ Thêm lịch trình</button>`);
 const title=d.querySelector('#title'),subtitle=title?.nextElementSibling;
 function show(id,label){d.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));const target=d.getElementById(id);if(target)target.classList.add('on');d.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.space===label));if(title)title.textContent=label==='work'?'Project & Task':label.charAt(0).toUpperCase()+label.slice(1);if(subtitle){const copy={overview:'Mọi thứ Darcy cần xử lý hôm nay, gói gọn trong một màn hình.',calendar:'Nhìn nhanh ngày bắt đầu, deadline và lịch công việc.',work:'Task cố định, task phát sinh và Projects trong cùng một workspace.',performance:'Theo dõi hiệu quả và rút insight từ dữ liệu.',library:'Tài nguyên làm việc cố định, dễ tìm và mở nhanh.',schedule:'Lịch trình riêng và các cuộc hẹn của Darcy.'};subtitle.textContent=copy[label]||''}}
 d.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{const x=b.dataset.space;if(x==='overview')show('overview',x);else if(x==='calendar')show('calendar',x);else if(x==='work')show('tasks',x);else show(x,x)});
 show('overview','overview');
 const mo=new MutationObserver(()=>{d.querySelectorAll('#taskBox tbody tr').forEach(tr=>{const cells=tr.querySelectorAll('td');if(cells.length>=4){const c=cells[3];if(c.textContent.includes('→')&&!c.querySelector('.deadline-note')){const parts=c.textContent.split('→');if(parts.length===2)c.innerHTML=`<span>${parts[0].trim()}</span> → <span class="deadline-note">${parts[1].trim()}</span>`}}})});mo.observe(d.body,{childList:true,subtree:true});
});
</script></body></html>
